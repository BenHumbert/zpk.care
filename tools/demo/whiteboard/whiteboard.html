<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Whiteboard</title>
<!--
  The walkthrough's whiteboard: an offline page the director feeds with page.evaluate (lib/whiteboard.mjs).
  Nothing here reaches the network. MathJax 3.2.2 (es5/tex-svg-full.js, fontCache 'none') is injected from the
  local node_modules by the director; the handwriting font, Comic Neue 2.003 (SIL OFL 1.1, see
  fonts/ComicNeue-OFL.txt), arrives as a data: URL in place of the placeholder in the @font-face rule below.

  Every glyph outline is traced with stroke-dasharray / stroke-dashoffset and then filled (the "write" effect),
  fraction bars grow from the left, and a marker tip follows the stroke. Each window.wb call is queued on one pen
  and resolves when its stroke ends.

    wb.prepare([{ id, latex }])                         typeset ahead of time; { count, errors }
    wb.writeEquation(latex, { id, durationMs, color, at, size, align })   or writeEquation({ id, latex, ms, ... })
    wb.annotate({ id, text, near, side, at, color, size, rotate, ms })   handwritten note, wiped in
    wb.circle({ target, ms, color, pad })   wb.underline({ target })   wb.box({ target })
    wb.arrow({ from, to, bend, ms, color })   wb.check({ target, label })   wb.value({ target, text })
    wb.erase({ ids })   wb.clear({ ms, ghost })   wb.setTitle(text)   wb.pen(visible)   wb.idle()
  A target is an item id ('eq1'), { eq, find: 'f5', nth }, { eq, line: 2 }, { eq, cssId }, or a box { x, y, w, h }.
  Colours: 'ink' #1d1d1f, 'blue' #1f4fbf, 'red' #c62828, 'green' #2e7d32, or any CSS colour.
-->
<style>
@font-face {
  font-family: 'Comic Neue Board';
  src: url(__COMIC_NEUE_DATA_URL__) format('truetype'), url('fonts/ComicNeue-Regular.ttf') format('truetype');
  font-display: block;
}
:root {
  --ink: #1d1d1f; --blue: #1f4fbf; --red: #c62828; --green: #2e7d32;
  --hand: 'Comic Neue Board', 'Comic Neue', 'Ink Free', 'Segoe Print', 'Comic Sans MS', cursive;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 28%, #e9e6df 0%, #d6d2c9 62%, #c8c3b8 100%);
  font-family: var(--hand);
}
#frame {
  position: absolute; left: 20px; top: 14px; right: 20px; bottom: 76px; padding: 11px; border-radius: 7px;
  background: linear-gradient(160deg, #f4f5f6 0%, #c3c8ce 22%, #eceef0 48%, #a9afb6 76%, #dfe2e5 100%);
  box-shadow: 0 14px 34px rgba(40, 36, 30, .28), 0 2px 4px rgba(40, 36, 30, .2), inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -1px 0 rgba(0, 0, 0, .18);
}
#surface {
  position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 2px;
  background-color: #f9f8f3;
  background-image:
    linear-gradient(115deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, .45) 50%, rgba(255, 255, 255, 0) 62%),
    linear-gradient(rgba(70, 90, 130, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70, 90, 130, .035) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .09), inset 0 3px 8px rgba(0, 0, 0, .07);
}
#smudges {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 360px 110px at 24% 34%, rgba(110, 112, 125, .055), transparent 72%),
    radial-gradient(ellipse 280px 80px at 71% 61%, rgba(70, 95, 165, .045), transparent 70%),
    radial-gradient(ellipse 210px 70px at 58% 18%, rgba(160, 60, 60, .03), transparent 70%),
    radial-gradient(ellipse 420px 140px at 40% 82%, rgba(110, 112, 125, .04), transparent 74%);
}
#ghost { position: absolute; inset: 0; pointer-events: none; }
#ghost > * { filter: blur(.6px); }
#title {
  position: absolute; left: 44px; top: 18px; right: 44px; height: 48px; white-space: nowrap;
  font: 400 34px/48px var(--hand); color: var(--ink); -webkit-text-stroke: .7px currentColor; letter-spacing: .2px;
}
.layer { position: absolute; inset: 0; }
.eq { position: absolute; white-space: nowrap; line-height: 0; }
.eq mjx-container { display: inline-block !important; margin: 0 !important; text-align: left !important; line-height: 0; }
.eq svg { overflow: visible; }
.note { position: absolute; white-space: nowrap; font-family: var(--hand); line-height: 1.15; -webkit-text-stroke: .35px currentColor; }
.ink { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#tray { position: absolute; left: 72px; width: 330px; top: 644px; height: 13px; border-radius: 0 0 5px 5px;
  background: linear-gradient(#c9cdd2, #9ea4ab); box-shadow: 0 4px 6px rgba(40, 36, 30, .25); }
#tray i { position: absolute; top: -9px; width: 52px; height: 10px; border-radius: 3px 5px 5px 3px; background: #f0f0ee; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .15); }
#tray i::after { content: ''; position: absolute; right: -4px; top: -1px; width: 15px; height: 12px; border-radius: 3px; background: var(--c); }
#tray i.ink { left: 18px; --c: var(--ink); } #tray i.blue { left: 84px; --c: var(--blue); }
#tray i.red { left: 150px; --c: var(--red); } #tray i.green { left: 216px; --c: var(--green); }
#tray b { position: absolute; left: 270px; top: -15px; width: 48px; height: 16px; border-radius: 4px;
  background: linear-gradient(#59616c 0 58%, #2c2c2c 58%); }
#tip { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 50; pointer-events: none; display: none; will-change: transform; }
#tip svg { position: absolute; left: -2px; top: -14px; transform: rotate(-38deg); transform-origin: 2px 14px; filter: drop-shadow(3px 7px 4px rgba(0, 0, 0, .22)); }
#eraserTool { position: fixed; left: 0; top: 0; width: 124px; height: 46px; margin: -23px 0 0 -62px; z-index: 49; pointer-events: none; display: none;
  border-radius: 7px; background: linear-gradient(#636c77 0 56%, #2a2a2a 56%); box-shadow: 0 6px 10px rgba(0, 0, 0, .25); will-change: transform; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="frame"><div id="surface"><div id="smudges"></div><div id="ghost"></div><div id="title"></div><div class="layer" id="layer"><svg class="ink"></svg></div></div></div>
<div id="tray"><i class="ink"></i><i class="blue"></i><i class="red"></i><i class="green"></i><b></b></div>
<div id="tip"><svg width="98" height="28" viewBox="0 0 98 28">
  <path d="M2 14 L13 9.5 L13 18.5 Z" fill="#2a2a2a"/>
  <rect class="tipColor" x="13" y="7.5" width="11" height="13" rx="2" fill="#1d1d1f"/>
  <rect x="24" y="5" width="56" height="18" rx="5" fill="#f2f2f0" stroke="#c4c4c0" stroke-width="1"/>
  <rect x="30" y="9" width="40" height="3" rx="1.5" fill="#ffffff" opacity=".8"/>
  <rect class="tipColor" x="78" y="4" width="18" height="20" rx="4" fill="#1d1d1f"/>
</svg></div>
<div id="eraserTool"></div>
<script>
(function () {
  'use strict';
  var COLORS = { ink: '#1d1d1f', blue: '#1f4fbf', red: '#c62828', green: '#2e7d32' };
  var colorOf = function (c) { return COLORS[c] || c || COLORS.ink; };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var surface = $('surface');
  var ghostEl = $('ghost');
  var titleEl = $('title');
  var tip = $('tip');
  var eraserTool = $('eraserTool');
  var layer = $('layer');
  var ink = layer.querySelector('svg.ink');

  // strokeEm: the outline pen's width as a share of the equation's font size (clamped to strokeMin..strokeMax px)
  var cfg = { strokeEm: 0.028, strokeMin: 0.6, strokeMax: 1.6, liftMin: 40, liftMax: 70, rough: true, order: 'reading', margin: 44, gap: 26, top: 84, bottomPad: 22, fill: 0.92, inkWidth: 3.2 };
  var items = new Map();      // id -> { id, kind, el, glyphs?, color }
  var prepared = new Map();   // id -> { latex, html }
  var cursorY = null;
  var seq = 0;
  var queue = Promise.resolve();
  var pending = 0;
  var lastError = null;
  var penShown = true;
  var tipPos = { x: 640, y: 360 };
  var tipHideTimer = null;
  var rnd = (function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(7);

  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  // a hidden page gets no animation frames; fall back to timers so a write never stalls
  var frame = function () { return new Promise(function (r) { if (document.hidden) setTimeout(r, 16); else requestAnimationFrame(r); }); };
  var easeSine = function (p) { return 0.5 - 0.5 * Math.cos(Math.PI * p); };
  /*
   * Units. The take shows this page at 1920x1080 with html { zoom: 1.5 }: the board is laid out in 1280x720 CSS
   * pixels and drawn crisp. getBoundingClientRect, getScreenCTM and the pen work in screen pixels; positions inside
   * the board (equations, notes, marks) are CSS pixels. Z() converts; zr() turns a screen rect into CSS pixels.
   */
  var Z = function () { return parseFloat(getComputedStyle(document.documentElement).zoom) || 1; };
  function zr(r) { var z = Z(); return { left: r.left / z, top: r.top / z, right: r.right / z, bottom: r.bottom / z, width: r.width / z, height: r.height / z }; }

  // ------------------------------------------------------------------ the pen
  function tipColor(color) {
    if (tip.__color === color) return;
    tip.__color = color;
    var parts = tip.querySelectorAll('.tipColor');
    for (var i = 0; i < parts.length; i++) parts[i].setAttribute('fill', color);
  }
  function tipAt(x, y, color) {
    tipPos = { x: x, y: y };
    if (color) tipColor(color);
    if (!penShown) return;
    if (tipHideTimer) { clearTimeout(tipHideTimer); tipHideTimer = null; }
    tip.style.display = 'block';
    var z = Z();
    tip.style.transform = 'translate(' + (x / z).toFixed(1) + 'px,' + (y / z).toFixed(1) + 'px)';
  }
  function scheduleTipHide(ms) {
    if (tipHideTimer) clearTimeout(tipHideTimer);
    tipHideTimer = setTimeout(function () { tip.style.display = 'none'; }, ms == null ? 1400 : ms);
  }
  async function travel(to, ms, color) {
    var from = tipPos;
    if (!ms || ms < 16) { tipAt(to.x, to.y, color); return; }
    var t0 = performance.now();
    for (;;) {
      await frame();
      var p = Math.min(1, (performance.now() - t0) / ms);
      var e = easeSine(p);
      // the pen lifts on its way: a slight arc
      var lift = Math.sin(Math.PI * p) * Math.min(18, Math.hypot(to.x - from.x, to.y - from.y) * 0.08);
      tipAt(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e - lift, color);
      if (p >= 1) break;
    }
  }
  function pointOn(el, l) {
    var p = el.getPointAtLength(l);
    var m = el.getScreenCTM();
    return { x: m.a * p.x + m.c * p.y + m.e, y: m.b * p.x + m.d * p.y + m.f };
  }

  // ------------------------------------------------------------------ geometry
  function surfaceRect() { return surface.getBoundingClientRect(); }
  function surfaceCss() { return zr(surface.getBoundingClientRect()); }
  /** A screen rect -> a box in the board's CSS pixels, relative to the board surface. */
  function toBox(r) {
    var s = surfaceRect();
    var z = Z();
    return { x: (r.left - s.left) / z, y: (r.top - s.top) / z, w: r.width / z, h: r.height / z };
  }
  function union(rects) {
    var l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
    for (var i = 0; i < rects.length; i++) {
      var q = rects[i];
      if (!q || (q.width === 0 && q.height === 0)) continue;
      l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    }
    if (l === Infinity) return null;
    return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
  }
  function glyphRect(g) {
    var r = g.getBoundingClientRect();
    if (g.tagName.toLowerCase() === 'rect' && g.__w0 != null && r.width < 0.5) {
      return { left: r.left, top: r.top, right: r.left + (g.__screenLen || 0), bottom: r.bottom, width: g.__screenLen || 0, height: r.height };
    }
    return r;
  }
  function boxOf(item) {
    if (item.kind === 'eq' && item.glyphs && item.glyphs.length) {
      var u = union(item.glyphs.map(glyphRect));
      if (u) return toBox(u);
    }
    if (item.kind === 'ink' && item.el.getBBox) {
      var r = item.el.getBoundingClientRect();
      return toBox(r);
    }
    return toBox(item.el.getBoundingClientRect());
  }

  // ------------------------------------------------------------------ MathJax
  var styleAdded = false;
  async function mathReady() {
    for (var i = 0; i < 600 && !(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise); i++) await sleep(50);
    if (!(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise)) throw new Error('MathJax is not loaded on the whiteboard page');
    await window.MathJax.startup.promise;
    if (!styleAdded && window.MathJax.svgStylesheet) {
      try { document.head.appendChild(window.MathJax.svgStylesheet()); } catch (e) { /* the inline sizes are enough */ }
      styleAdded = true;
    }
  }
  async function typeset(latex) {
    await mathReady();
    var MJ = window.MathJax;
    var node = MJ.tex2svgPromise ? await MJ.tex2svgPromise(String(latex), { display: true }) : MJ.tex2svg(String(latex), { display: true });
    var err = node.querySelector('[data-mjx-error]') || node.querySelector('[data-mml-node="merror"]');
    if (err) throw new Error('TeX: ' + (err.getAttribute('data-mjx-error') || err.getAttribute('title') || err.textContent || 'error'));
    return node;
  }

  // ------------------------------------------------------------------ glyph order and text
  var DRAWABLE = { path: 1, rect: 1, text: 1, line: 1, polyline: 1, polygon: 1, ellipse: 1, circle: 1 };
  function drawablesOf(root, mode) {
    var out = [];
    (function walk(node) {
      if (!node || node.nodeType !== 1) return;
      var tag = node.tagName.toLowerCase();
      if (tag === 'defs' || tag === 'title' || tag === 'desc' || tag === 'style') return;
      if (DRAWABLE[tag]) { out.push(node); return; }
      var kids = Array.prototype.slice.call(node.children);
      if (node.getAttribute && node.getAttribute('data-mml-node') === 'mfrac') {
        // numerator, then the bar, then the denominator: a fraction reads top to bottom
        var bars = kids.filter(function (k) { return k.tagName.toLowerCase() === 'rect'; });
        var rest = kids.filter(function (k) { return k.tagName.toLowerCase() !== 'rect'; });
        if (rest.length >= 2 && bars.length) {
          walk(rest[0]);
          bars.forEach(function (b) { out.push(b); });
          rest.slice(1).forEach(walk);
          return;
        }
      }
      kids.forEach(walk);
    })(root);
    if (mode === 'x') return byColumns(out, root);
    return out;
  }
  function outerRows(svg) {
    var table = svg.querySelector('g[data-mml-node="mtable"]');
    if (!table) return [];
    return Array.prototype.slice.call(table.children).filter(function (k) {
      var n = k.getAttribute && k.getAttribute('data-mml-node');
      return n === 'mtr' || n === 'mlabeledtr';
    });
  }
  /** The spec's alternative: within each row, left to right, and top to bottom inside overlapping columns. */
  function byColumns(list, svg) {
    var rows = outerRows(svg);
    var rowOf = function (el) { for (var i = 0; i < rows.length; i++) if (rows[i].contains(el)) return i; return 0; };
    var groups = new Map();
    list.forEach(function (el) { var k = rowOf(el); if (!groups.has(k)) groups.set(k, []); groups.get(k).push({ el: el, r: el.getBoundingClientRect() }); });
    var out = [];
    Array.from(groups.keys()).sort(function (a, b) { return a - b; }).forEach(function (k) {
      var g = groups.get(k).sort(function (a, b) { return a.r.left - b.r.left; });
      var cols = [];
      g.forEach(function (it) {
        var last = cols[cols.length - 1];
        if (last && it.r.left < last.right - Math.min(it.r.width, last.minW) * 0.4) {
          last.items.push(it); last.right = Math.max(last.right, it.r.right); last.minW = Math.min(last.minW, it.r.width);
        } else cols.push({ items: [it], right: it.r.right, minW: Math.max(1, it.r.width) });
      });
      cols.forEach(function (c) { c.items.sort(function (a, b) { return a.r.top - b.r.top; }).forEach(function (it) { out.push(it.el); }); });
    });
    return out;
  }
  function charOf(el) {
    var tag = el.tagName.toLowerCase();
    if (tag === 'path') {
      var c = el.getAttribute('data-c');
      if (!c) return '';
      try { return String.fromCodePoint(parseInt(c, 16)).normalize('NFKC'); } catch (e) { return ''; }
    }
    if (tag === 'text') return String(el.textContent || '').normalize('NFKC');
    return '';
  }
  /** The equation as plain text in writing order ("W=H(0,f0,f1,…)"), with a map from characters to glyphs. */
  function glyphText(glyphs) {
    var text = '';
    var map = [];
    glyphs.forEach(function (g, i) {
      var s = charOf(g).replace(/\s+/g, '');   // \  and \quad spaces are glyphs too; a search ignores them
      for (var k = 0; k < s.length; k++) { text += s[k]; map.push(i); }
    });
    return { text: text, map: map };
  }

  // ------------------------------------------------------------------ targets
  function resolveBox(t) {
    if (t == null) throw new Error('no target');
    if (typeof t === 'string') {
      var it0 = items.get(t);
      if (!it0) throw new Error('unknown target "' + t + '"');
      return boxOf(it0);
    }
    if (t.x != null && t.y != null && t.w != null) return { x: t.x, y: t.y, w: t.w, h: t.h || 0 };
    if (t.x != null && t.y != null) return { x: t.x, y: t.y, w: 0, h: 0 };
    var it = items.get(t.eq || t.id || t.item);
    if (!it) throw new Error('unknown target ' + JSON.stringify(t));
    if (it.kind !== 'eq') return boxOf(it);
    if (t.find != null || t.findRe != null) {
      var gt = glyphText(it.glyphs);
      var start = -1, len = 0;
      if (t.findRe != null) {
        var re = new RegExp(t.findRe, 'g');
        var m, n = 0;
        while ((m = re.exec(gt.text))) { if (n++ === (t.nth || 0)) { start = m.index; len = m[0].length; break; } if (!m[0].length) re.lastIndex++; }
      } else {
        var needle = String(t.find).replace(/\s+/g, '');
        var from = 0;
        for (var k = 0; k <= (t.nth || 0); k++) { start = gt.text.indexOf(needle, from); if (start < 0) break; from = start + 1; }
        len = needle.length;
      }
      if (start < 0) throw new Error('"' + (t.find != null ? t.find : t.findRe) + '" is not in ' + it.id + ' (it reads: ' + gt.text + ')');
      var picked = [];
      for (var j = start; j < start + len; j++) if (picked.indexOf(gt.map[j]) < 0) picked.push(gt.map[j]);
      return toBox(union(picked.map(function (i) { return glyphRect(it.glyphs[i]); })));
    }
    if (t.line != null) {
      var rows = outerRows(it.svg);
      var row = rows[(t.line | 0) - 1];
      if (!row) throw new Error(it.id + ' has ' + rows.length + ' lines, not ' + t.line);
      return toBox(union(it.glyphs.filter(function (g) { return row.contains(g); }).map(glyphRect)));
    }
    if (t.cssId) {
      var el = it.el.querySelector('#' + CSS.escape(t.cssId));
      if (!el) throw new Error('no \\cssId{' + t.cssId + '} in ' + it.id);
      return toBox(union(it.glyphs.filter(function (g) { return el.contains(g); }).map(glyphRect)) || el.getBoundingClientRect());
    }
    return boxOf(it);
  }
  function center(b) { return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; }
  function edgePoint(b, toward, pad) {
    var c = center(b);
    var dx = toward.x - c.x, dy = toward.y - c.y;
    if (!dx && !dy) return c;
    var hw = b.w / 2 + pad, hh = b.h / 2 + pad;
    var s = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
    return { x: c.x + dx * s, y: c.y + dy * s };
  }
  function clampInto(x, y, w, h) {
    var s = surfaceCss();
    return { x: Math.max(10, Math.min(s.width - w - 10, x)), y: Math.max(8, Math.min(s.height - h - cfg.bottomPad, y)) };
  }
  function besideBox(b, w, h, side, gap) {
    if (side === 'left') return { x: b.x - gap - w, y: b.y + b.h / 2 - h / 2 };
    if (side === 'above') return { x: b.x + b.w / 2 - w / 2, y: b.y - gap - h };
    if (side === 'below') return { x: b.x + b.w / 2 - w / 2, y: b.y + b.h + gap };
    return { x: b.x + b.w + gap, y: b.y + b.h / 2 - h / 2 };
  }
  /** Beside a box, but past any note or mark already there (a second note on the same side moves along). */
  function freeSpot(b, w, h, side, gap) {
    var p = besideBox(b, w, h, side, gap);
    var others = [];
    items.forEach(function (it) {
      if (it.kind === 'note' || it.kind === 'check') others.push(boxOf(it));
    });
    for (var k = 0; k < 8; k++) {
      var hit = null;
      for (var i = 0; i < others.length; i++) {
        var o = others[i];
        if (p.x < o.x + o.w && p.x + w > o.x && p.y < o.y + o.h && p.y + h > o.y) { hit = o; break; }
      }
      if (!hit) break;
      if (side === 'left') p.x = hit.x - w - 12;

    var hasContent = items.size || (titleEl.textContent && !o.keepTitle);
    var oldLayer = layer;
    oldLayer.style.transition = 'opacity ' + ms + 'ms linear';
    oldLayer.style.opacity = String(Math.max(g, 0.02));
    // the title is wiped for good (a ghost title under the next one only clutters); the content leaves a ghost
    if (!o.keepTitle && titleEl.textContent) {
      titleEl.style.transition = 'opacity ' + ms + 'ms linear';
      titleEl.style.opacity = '0';
    }
    if (hasContent && !o.instant) await sweep({ x: 24, y: 14, w: s.width - 48, h: s.height - 40 }, ms);
    // only the latest ghost stays on the board: the older ones are wiped for good
    ghostEl.innerHTML = '';
    oldLayer.removeAttribute('id');
    ghostNode(oldLayer, g);
    if (!o.keepTitle) titleEl.textContent = '';
    titleEl.style.transition = '';
    titleEl.style.opacity = '1';
    layer = document.createElement('div');
    layer.className = 'layer';
    layer.id = 'layer';
    ink = document.createElementNS(SVGNS, 'svg');
    ink.setAttribute('class', 'ink');
    layer.appendChild(ink);
    surface.appendChild(layer);
    items.clear();
    cursorY = null;
    return { ok: true };
  }
  function pen(visible) {
    penShown = visible !== false;
    if (!penShown) tip.style.display = 'none';
    return { ok: true };
  }

  // ------------------------------------------------------------------ the queue and the API
  function enqueue(fn) {
    pending++;
    var p = queue.then(fn);
    queue = p.catch(function (e) { lastError = e; }).then(function () { pending--; });
    return p;
  }
  async function prepare(list) {
    var errors = [];
    for (var i = 0; i < (list || []).length; i++) {
      var e = list[i];
      try {
        var node = await typeset(e.latex);
        prepared.set(e.id, { latex: e.latex, html: node.outerHTML });
      } catch (err) {
        errors.push({ id: e.id, message: String((err && err.message) || err) });
      }
    }
    return { count: prepared.size, errors: errors };
  }
  /** The writing-order text of an equation, for authoring { find } targets. */
  async function text(id) {
    var it = items.get(id);
    if (it && it.kind === 'eq') return glyphText(it.glyphs).text;
    var pre = prepared.get(id);
    if (!pre) throw new Error('no equation ' + id);
    var tmp = document.createElement('div');
    tmp.className = 'eq';
    tmp.style.cssText = 'left:-9999px;top:0;font-size:40px';
    tmp.innerHTML = pre.html;
    document.body.appendChild(tmp);
    var t = glyphText(drawablesOf(tmp.querySelector('svg'), cfg.order)).text;
    tmp.remove();
    return t;
  }
  async function ready() {
    await mathReady();
    try { await document.fonts.load('26px "Comic Neue Board"'); } catch (e) { /* the CSS fallbacks take over */ }
    return { ok: true, mathjax: window.MathJax && window.MathJax.version, font: document.fonts.check('26px "Comic Neue Board"') };
  }
  window.wb = {
    ready: ready,
    configure: function (o) { Object.assign(cfg, o || {}); return Object.assign({}, cfg); },
    prepare: prepare,
    text: text,
    state: function () { return { items: Array.from(items.keys()), prepared: Array.from(prepared.keys()), cursorY: cursorY, pending: pending, lastError: lastError ? String(lastError.message || lastError) : null }; },
    idle: function () { return queue.then(function () { return { ok: !lastError, lastError: lastError ? String(lastError.message || lastError) : null }; }); },
    boxOf: function (target) { return resolveBox(target); },
    setTitle: function (t, o) { return enqueue(function () { return setTitle(t, o); }); },
    writeEquation: function (a, b) { return enqueue(function () { return writeEquation(a, b); }); },
    annotate: function (o) { return enqueue(function () { return annotate(o); }); },
    value: function (o) { return enqueue(function () { return value(o); }); },
    circle: function (o) { return enqueue(function () { return circle(o); }); },
    underline: function (o) { return enqueue(function () { return underline(o); }); },
    box: function (o) { return enqueue(function () { return box(o); }); },
    arrow: function (o) { return enqueue(function () { return arrow(o); }); },
    check: function (o) { return enqueue(function () { return check(o); }); },
    erase: function (o) { return enqueue(function () { return erase(o); }); },
    clear: function (o) { return enqueue(function () { return clear(o); }); },
    pen: function (v) { return enqueue(function () { return pen(v); }); }
  };
})();
</script>
</body>
