<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescriber Node</title>
  <link rel="stylesheet" href="css/node-dashboard.css">
</head>
<body>

  <!-- Fixed Header -->
  <header class="node-header theme-prescriber">
    <img src="logo.png" alt="Adjuda-GATOR" class="brand-logo-img">
    <h1 style="color: var(--color-prescriber);">Prescriber Node</h1>
    <div id="header-selector"></div>
    <div class="node-identity">
      <span class="wallet-id-display" id="header-wallet-id">--</span>
      <span class="lifecycle-pill lifecycle-registered" id="header-lifecycle">--</span>
      <span class="health-dot disconnected" id="header-health" title="Sequencer connection"></span>
    </div>
  </header>

  <!-- Dashboard Grid -->
  <main class="dashboard-grid">
    <div id="section-identity"></div>
    <div id="section-prescribe"></div>
    <div id="section-pcp-patients"></div>
    <div id="section-history"></div>
    <div id="section-activity"></div>
    <div id="section-patients"></div>
    <div id="section-medications"></div>
    <div id="section-pharmacies"></div>
    <div id="section-formulary"></div>
    <div id="section-receipts"></div>
    <div id="section-info"></div>
  </main>

  <script type="module" src="js/prescriber-dashboard.js"></script>
</body>
</html>
