<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employer Node</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="logo.png" alt="Adjuda-GATOR" class="brand-logo-img">
      <span class="logo">Employer Node</span>
    </div>
    <nav class="nav" id="main-nav" role="navigation" aria-label="Main navigation">
      <a href="#overview" class="nav-link active" data-tab="overview" role="tab">Overview</a>
      <a href="#groups" class="nav-link" data-tab="groups" role="tab">Groups</a>
      <a href="#tokens" class="nav-link" data-tab="tokens" role="tab">Tokens</a>
      <a href="#roster" class="nav-link" data-tab="roster" role="tab">Roster</a>
      <a href="#messaging" class="nav-link" data-tab="messaging" role="tab">Messaging</a>
      <a href="#admin" class="nav-link" data-tab="admin" role="tab">Admin</a>
    </nav>
    <div class="header-right">
      <span class="connection-status" id="connection-status">
        <span class="status-dot disconnected" id="status-dot" aria-label="Connection status"></span>
        <span class="status-label" id="status-label">Disconnected</span>
      </span>
    </div>
  </header>

  <main class="main" id="app" role="main">
    <!-- Pages rendered by app.js -->
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script src="rpc.js"></script>
  <script src="app.js"></script>
</body>
</html>
